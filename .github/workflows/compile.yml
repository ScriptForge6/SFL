name: Compile

on:
  push:
    branches: [ release ]

  pull_request:

  workflow_dispatch:
    inputs:
      mode:
        description: 构建模式
        type: choice
        options: [ release, debug ]
        default: release

  workflow_call:
    inputs:
      mode:
        description: 构建模式
        type: string
        required: false
        default: release

# 同一分支有新提交时，取消旧任务
concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      # Shared Build
      - name: Configure Shared
        run: xmake f -c -y -m ${{ inputs.mode || 'release' }}

      - name: Build Shared
        run: xmake -y -v

      # Static Build
      - name: Configure Static
        run: xmake f --static=y -c -y -m ${{ inputs.mode || 'release' }}

      - name: Build Static
        run: xmake -y -v

      # Shared 和 Static 分别输出到 build/output 下的独立目录
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: SFL-${{ runner.os }}-${{ inputs.mode || 'release' }}
          path: build/output
          if-no-files-found: error
