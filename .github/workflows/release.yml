name: Release

on:
  push:
    tags: [ 'v*' ]

  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/compile.yml
    with:
      mode: release

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 只为了取得 LICENSE.txt、THIRD_PARTY_NOTICES.md 和 license/ 目录，不需要子模块。
      # 必须放在 download-artifact 之前：checkout 会清空工作区。
      - name: Checkout
        uses: actions/checkout@v4

      # 将各平台 Artifact 合并到 build/output。
      # 各平台的目录是 <plat>/<arch>/<kind>/release，windows-x86 与 windows-x64 不会冲突。
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/output
          pattern: SFL-*-release
          merge-multiple: true

      - name: Delete compilation intermediate files
        shell: pwsh
        run: |
          $targetDir = "./build/output"
          $allowedExtensions = @(
            ".dll",
            ".pdb",
            ".exe",
            ".so",
            ".dylib",
            ""
          )

          Get-ChildItem -Path $targetDir -File -Recurse | ForEach-Object {
            if ($allowedExtensions -contains $_.Extension.ToLowerInvariant()) {
              Write-Host "Keep: $($_.Name)" -ForegroundColor Green
            } else {
              Write-Host "Delete: $($_.FullName)" -ForegroundColor Red
              Remove-Item -Path $_.FullName -Force
            }
          }

      # upload-artifact 不保留文件权限，Linux / macOS 的可执行文件（无扩展名）要重新加上，
      # 否则 tar.gz 里的程序解压后不能直接运行。
      - name: Restore executable permission
        shell: pwsh
        run: |
          Get-ChildItem -Path ./build/output -File -Recurse |
            Where-Object { $_.Extension -eq '' } |
            ForEach-Object {
              Write-Host "chmod +x $($_.FullName)"
              chmod +x $_.FullName
            }

      - name: Compress artifacts
        shell: pwsh
        run: |
          $destDir = "./dist"

          if (-not (Test-Path $destDir)) {
            New-Item -Path $destDir -ItemType Directory | Out-Null
          }

          # 随包分发的许可证文件。缺任何一个都直接失败，避免发出不带许可证的包。
          $licenseFiles = @('LICENSE.txt', 'THIRD_PARTY_NOTICES.md')
          $licenseDir   = './license'
          # 仅供查阅的发行版版权清单，不打进发布包
          $skipLicense  = @()

          foreach ($f in $licenseFiles) {
            if (-not (Test-Path $f -PathType Leaf)) { throw "Missing license file: $f" }
          }
          if (-not (Test-Path $licenseDir -PathType Container)) { throw "Missing directory: $licenseDir" }

          $outputBase = "./build/output"
          $releaseDirs = Get-ChildItem -Path $outputBase -Recurse -Directory |
            Where-Object { $_.Name -eq 'release' }

          if (-not $releaseDirs) {
            throw "No release output directories found in $outputBase"
          }

          foreach ($dir in $releaseDirs) {
            $libraryKind = $dir.Parent.Name
            $arch        = $dir.Parent.Parent.Name
            $plat        = $dir.Parent.Parent.Parent.Name

            $archiveBase = "SFL_${libraryKind}_${plat}_${arch}"

            Write-Host "----------------------------------------"
            Write-Host "Package: $archiveBase" -ForegroundColor Cyan

            # 把许可证放进压缩包根目录（此步在“删除中间文件”和 chmod 之后，不会被误删或加执行权限）
            foreach ($f in $licenseFiles) {
              Copy-Item -Path $f -Destination $dir.FullName -Force
            }
            $licenseOut = Join-Path $dir.FullName 'license'
            New-Item -Path $licenseOut -ItemType Directory -Force | Out-Null
            Get-ChildItem -Path $licenseDir -File |
              Where-Object { $skipLicense -notcontains $_.Name } |
              Copy-Item -Destination $licenseOut -Force

            if ($plat -eq 'windows') {
              # Windows 用 zip
              Compress-Archive -Path "$($dir.FullName)/*" -DestinationPath (Join-Path $destDir "$archiveBase.zip") -Force
            }
            else {
              # Linux / macOS 用 tar.gz（保留可执行权限）
              tar -czf (Join-Path $destDir "$archiveBase.tar.gz") -C $dir.FullName .
            }
          }

          Get-ChildItem $destDir | Format-Table Name, Length

      # 只有推送标签时才发布 Release
      - name: Create release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # 手动运行时没有标签，把压缩包作为产物留下来方便检查
      - name: Upload dist (non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: SFL-dist
          path: dist/*
          if-no-files-found: error