name: Compile

on:
  push:
    branches: [ dev, release ]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      mode:
        description: 构建模式
        type: choice
        options: [ release, debug ]
        default: release

# 同一分支上有新提交时，取消还在跑的旧任务
concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # 一个平台失败时，其他平台继续跑，方便对比
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # thirdParty 下如果有 git 子模块（比如 webview）

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      # 手动运行时用所选模式；push / PR 没有这个输入，回落到 release
      - name: Configure
        run: xmake f -c -y -m ${{ inputs.mode || 'release' }}

      - name: Build
        run: xmake -y -v

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: SFL-${{ runner.os }}-${{ inputs.mode || 'release' }}
          path: build/target
          if-no-files-found: error