name: Compile

on:
  push:
    branches: [ release ]

  pull_request:
    paths-ignore:
      - '.vscode/**'
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.gitattributes'
      - 'Count-Code.ps1'
      - 'Find-Todo.ps1'
      
  workflow_dispatch:
    inputs:
      mode:
        description: 构建模式
        type: choice
        options: [ release, debug ]
        default: release

  workflow_call:
    inputs:
      mode:
        description: 构建模式
        type: string
        required: false
        default: release

# 同一分支有新提交时，取消旧任务
concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # archflag 会原样拼进 xmake f；留空表示用运行器本机架构
          - { name: windows-x64, os: windows-latest,   archflag: '' }
          - { name: windows-x86, os: windows-latest,   archflag: '-a x86' }   # x64 运行器上交叉编译 x86
          - { name: linux-x64,   os: ubuntu-latest,    archflag: '' }
          - { name: linux-arm64, os: ubuntu-24.04-arm, archflag: '' }         # 原生 arm64 运行器
          - { name: macos-arm64, os: macos-latest,     archflag: '' }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      # Shared Build
      - name: Configure Shared
        run: xmake f -c -y -m ${{ inputs.mode || 'release' }} ${{ matrix.archflag }}

      - name: Build Shared
        run: xmake -y -v

      # Static Build
      - name: Configure Static
        run: xmake f --static=y -c -y -m ${{ inputs.mode || 'release' }} ${{ matrix.archflag }}

      - name: Build Static
        run: xmake -y -v

      # Shared 和 Static 分别输出到 build/output 下的独立目录
      # 产物名必须唯一：windows-x64 和 windows-x86 的 runner.os 相同，所以改用 matrix.name
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: SFL-${{ matrix.name }}-${{ inputs.mode || 'release' }}
          path: build/output
          if-no-files-found: error